<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RapidMock form fixture</title><style>body{font:16px system-ui;max-width:560px;margin:40px auto;padding:20px;color:#234634;background:#f5f7ef}label{display:block;margin:18px 0}input,select,textarea{display:block;padding:10px;width:100%;box-sizing:border-box;margin-top:6px;border:1px solid #bacbb2;border-radius:6px}pre{white-space:pre-wrap;background:white;padding:16px}</style></head><body>
<h1>RapidMock form fixture</h1><p>Serve this page with <code>npm run dev</code>, then open <code>/test-form.html</code>. Open the installed extension and preview the fields.</p>
<form><label>First name<input name="first_name" autocomplete="given-name"></label><label>Last name<input name="last_name" autocomplete="family-name"></label><label>Email<input type="email" autocomplete="email"></label><label>Company<input name="company"></label><label>City<input name="city"></label><label>Country<select autocomplete="country"><option value="">Choose…</option><option value="NG">Nigeria</option><option value="US">United States</option></select></label><label>Existing value (should be preserved)<input name="username" value="keep-me"></label><label>Password (should be skipped)<input type="password" autocomplete="new-password"></label></form><h2>Last event</h2><pre id="events">Waiting for input…</pre><script src="/test-form.js"></script></body></html>
